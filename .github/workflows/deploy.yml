name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_DOMAIN: ${{ vars.SITE_DOMAIN || 'scientificresearchers.org' }}
  VPS_PORT: ${{ vars.VPS_PORT || '22' }}
  DEPLOY_ROOT: ${{ vars.VPS_DEPLOY_ROOT || '/opt/scientific-researchers' }}

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Django checks
        working-directory: backend
        env:
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: ci-only-not-for-production
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test

      - name: Build Astro site
        working-directory: frontend
        env:
          PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ vars.PUBLIC_WEB3FORMS_ACCESS_KEY || secrets.PUBLIC_WEB3FORMS_ACCESS_KEY }}
          PUBLIC_SNIPCART_API_KEY: ${{ vars.PUBLIC_SNIPCART_API_KEY || secrets.PUBLIC_SNIPCART_API_KEY }}
          PUBLIC_BUYMEACOFFEE_URL: ${{ vars.PUBLIC_BUYMEACOFFEE_URL || secrets.PUBLIC_BUYMEACOFFEE_URL }}
          PUBLIC_NEON_AUTH_URL: ${{ vars.PUBLIC_NEON_AUTH_URL || secrets.PUBLIC_NEON_AUTH_URL }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL || secrets.PUBLIC_API_URL || format('https://{0}', vars.SITE_DOMAIN || 'scientificresearchers.org') }}
        run: |
          npm ci
          npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Require SSH secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=0
          if [ -z "$VPS_HOST" ]; then echo "Missing VPS_HOST (variable or secret)"; missing=1; fi
          if [ -z "$VPS_USER" ]; then echo "Missing VPS_USER (variable or secret)"; missing=1; fi
          if [ -z "$VPS_SSH_KEY" ]; then echo "Missing secret VPS_SSH_KEY"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            echo "Configure the values listed in docs/deploy-vps.md and re-run."
            exit 1
          fi

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$VPS_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "VPS_SSH_KNOWN_HOSTS is unset; falling back to ssh-keyscan."
            ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Stage and rsync release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER }}
        run: |
          set -euo pipefail
          RELEASE="${GITHUB_SHA}"
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/backend" "$STAGE/www"
          rsync -a --delete --exclude-from=infra/deploy/rsync-backend.exclude backend/ "$STAGE/backend/"
          rsync -a --delete frontend/dist/ "$STAGE/www/"
          cp infra/Caddyfile "$STAGE/Caddyfile"
          cp infra/deploy/remote-release.sh infra/deploy/rollback.sh "$STAGE/"

          SSH=(ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          RSYNC=(rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes")

          "${SSH[@]}" "${VPS_USER}@${VPS_HOST}" "mkdir -p '${DEPLOY_ROOT}/releases/${RELEASE}' '${DEPLOY_ROOT}/scripts'"
          "${RSYNC[@]}" "$STAGE/backend/" "${VPS_USER}@${VPS_HOST}:${DEPLOY_ROOT}/releases/${RELEASE}/backend/"
          "${RSYNC[@]}" "$STAGE/www/" "${VPS_USER}@${VPS_HOST}:${DEPLOY_ROOT}/releases/${RELEASE}/www/"
          "${RSYNC[@]}" "$STAGE/Caddyfile" "${VPS_USER}@${VPS_HOST}:${DEPLOY_ROOT}/releases/${RELEASE}/Caddyfile"
          "${RSYNC[@]}" infra/deploy/remote-release.sh infra/deploy/rollback.sh \
            "${VPS_USER}@${VPS_HOST}:${DEPLOY_ROOT}/scripts/"

          "${SSH[@]}" "${VPS_USER}@${VPS_HOST}" "chmod +x '${DEPLOY_ROOT}/scripts/remote-release.sh' '${DEPLOY_ROOT}/scripts/rollback.sh'"
          "${SSH[@]}" "${VPS_USER}@${VPS_HOST}" \
            "DEPLOY_ROOT='${DEPLOY_ROOT}' '${DEPLOY_ROOT}/scripts/remote-release.sh' '${RELEASE}'"

      - name: Public health check
        if: ${{ vars.SITE_DOMAIN != '' }}
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS "https://${SITE_DOMAIN}/api/health/" | grep -q '"ok"'; then
              echo "https://${SITE_DOMAIN}/api/health/ is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Public health check failed (certificate or DNS may still be propagating). Loopback check already passed on the VPS."
          exit 0
